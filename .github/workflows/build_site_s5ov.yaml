name: Nightly NASDAQ-100 Momentum low DrawDown
on:
  schedule:
    - cron: "15 0 * * *"  # 00:15 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r req_html.txt
      - name: Generate site
        run: build_site_s5ov.py
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # JOB 3: Keep the scheduled workflow alive (prevents GitHub auto-disabling it after 60 days idle)
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'   # skip on manual workflow_dispatch runs
    permissions:
      contents: write   # overrides the top-level 'read' just for this job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Keep workflow alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
